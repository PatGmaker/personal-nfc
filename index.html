<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Patrick Astrera Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Patrick Astrera, IT student at ACTS Computer College. Mobile apps, web projects and digital invitations.">
<meta name="theme-color" content="#0a1f4d">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
  /* Layout: one phone-width column. Photo card leads, Save Contact is the one primary action,
     then a 4-up contact grid, then link rows (socials, apps) in a single grouped list each. */
  :root {
    --bg:#eef2f8; --surface:#ffffff; --surface-2:#f4f7fc; --fg:#0f172a; --muted:#4f5a70; --line:#dde4ef;
    --navy:#0a1f4d; --navy-2:#143c8f; --blue:#0b4fd1; --blue-2:#2f8cff; --on-blue:#ffffff;
    --tint:#e6efff; --ring:#2f8cff;
    --display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --body:"Inter", "Segoe UI", system-ui, sans-serif;
    --r-lg:22px; --r-md:14px; --r-sm:10px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#070d1b; --surface:#0f1830; --surface-2:#142042; --fg:#eaf0ff; --muted:#a3aec8; --line:#22305a;
    --blue:#3b82f6; --tint:#16264d; color-scheme:dark } }
  :root[data-theme="dark"] {
    --bg:#070d1b; --surface:#0f1830; --surface-2:#142042; --fg:#eaf0ff; --muted:#a3aec8; --line:#22305a;
    --blue:#3b82f6; --tint:#16264d; color-scheme:dark }

  * { box-sizing:border-box; }
  ::selection { background:var(--blue-2); color:#fff; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 var(--body); -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  :focus-visible { outline:3px solid var(--ring); outline-offset:3px; border-radius:var(--r-sm); }

  .banner { height:140px; background:radial-gradient(120% 140% at 50% -10%, var(--navy-2), var(--navy)); }
  main { max-width:440px; margin:-104px auto 0; padding-block:0 44px;
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }

  /* Profile card */
  .profile { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden;
    box-shadow:0 1px 2px #0f172a14, 0 18px 40px -12px #0f172a33; animation:rise .7s var(--ease) both; }
  .photo { position:relative; aspect-ratio:1 / 1.08; max-width:100%; overflow:hidden; background:var(--navy); }
  .photo img { width:100%; height:100%; object-fit:cover; object-position:center 32%; display:block; transition:transform .6s var(--ease); }
  .profile:hover .photo img { transform:scale(1.025); }
  .photo::after { content:""; position:absolute; inset:auto 0 0; height:28%; background:linear-gradient(to top, #0a1f4d55, transparent); pointer-events:none; }
  .nfc { position:absolute; top:12px; right:12px; z-index:1; display:inline-flex; align-items:center; gap:6px; padding:6px 10px 6px 8px;
    border-radius:999px; background:#0a1f4dcc; color:#fff; font:600 12px/1 var(--body); letter-spacing:.02em; }
  .nfc svg { width:15px; height:15px; }

  .info { padding:20px 22px 4px; text-align:center; }
  h1 { margin:0; font:700 clamp(23px, 6.4vw, 27px)/1.15 var(--display); letter-spacing:-.02em; text-wrap:balance; }
  .role { margin-top:6px; color:var(--blue); font-weight:600; font-size:14px; }
  .bio { margin:12px auto 0; max-width:34ch; color:var(--muted); font-size:14.5px; text-wrap:pretty; }

  .primary { display:flex; align-items:center; justify-content:center; gap:10px; width:calc(100% - 44px); min-height:52px; margin:18px 22px 20px;
    border:0; border-radius:var(--r-md); background:linear-gradient(180deg, #1d63e0, #0a47c2); color:var(--on-blue);
    font:600 16px/1 var(--body); cursor:pointer; box-shadow:0 8px 18px -8px #0000004d;
    transition:transform .18s var(--ease), box-shadow .18s var(--ease), filter .18s; }
  .primary svg { width:20px; height:20px; }
  .primary:hover { transform:translateY(-2px); box-shadow:0 12px 22px -8px #00000066; }
  .primary:active { transform:translateY(0) scale(.98); filter:brightness(.95); }

  /* Contact grid */
  .contact { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; padding:0 22px 22px; }
  .tile { display:grid; justify-items:center; gap:6px; padding:12px 4px 10px; border-radius:var(--r-md); background:var(--surface-2);
    text-decoration:none; font-size:12px; font-weight:600; color:var(--fg); transition:transform .18s var(--ease), background .18s; }
  .tile span.ic { display:grid; place-items:center; width:40px; height:40px; border-radius:50%; background:var(--tint); color:var(--blue); }
  .tile svg { width:19px; height:19px; }
  .tile:hover { transform:translateY(-2px); background:var(--tint); }
  .tile:active { transform:scale(.97); }

  .details { border-top:1px solid var(--line); padding:16px 22px 18px; display:grid; gap:12px; font-size:14px; }
  .row { display:grid; grid-template-columns:18px 1fr; gap:12px; align-items:start; }
  .row svg { width:18px; height:18px; color:var(--blue); margin-top:2px; }
  .row span { min-width:0; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }

  /* Link groups */
  h2 { margin:30px 6px 10px; font:600 13px/1 var(--body); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .group { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; }
  .link { display:grid; grid-template-columns:42px 1fr 18px; gap:14px; align-items:center; min-height:64px; padding:11px 16px;
    text-decoration:none; transition:background .18s; }
  .link + .link { border-top:1px solid var(--line); }
  .link:hover { background:var(--surface-2); }
  .link:active { background:var(--tint); }
  .badge { display:grid; place-items:center; width:42px; height:42px; border-radius:12px; color:#fff; }
  .badge svg { width:21px; height:21px; }
  .t { min-width:0; }
  .t b { display:block; font-weight:600; font-size:15px; }
  .t small { display:block; color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  .go { width:18px; height:18px; color:var(--muted); transition:transform .18s var(--ease), color .18s; }
  .link:hover .go { transform:translateX(3px); color:var(--blue); }
  .facebook { background:#1877f2; } .instagram { background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af); }
  .app-cook { background:#e8590c; } .app-fore { background:#0f7b4d; }

  .toast { text-align:center; color:var(--muted); font-size:13px; min-height:1.4em; margin:0 22px 14px; }
  .toast:empty { display:none; }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:28px; }

  @keyframes rise { from { transform:translateY(14px); } to { transform:none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>

<div class="banner" aria-hidden="true"></div>
<main>
  <section class="profile" aria-labelledby="name">
    <div class="photo" id="photo">
      <span class="nfc"><svg aria-hidden="true"><use href="#i-nfc"/></svg>NFC card</span>
    </div>
    <div class="info">
      <h1 id="name"></h1>
      <div class="role" id="role"></div>
      <p class="bio" id="bio"></p>
    </div>
    <button class="primary" id="save" type="button"><svg aria-hidden="true"><use href="#i-user"/></svg>Save Contact</button>
    <div class="toast" id="toast" role="status"></div>
    <nav class="contact" id="contact" aria-label="Contact"></nav>
    <div class="details" id="details"></div>
  </section>

  <h2 id="h-social">Social media</h2>
  <div class="group" id="links" aria-labelledby="h-social"></div>

  <h2 id="h-apps">My Apps</h2>
  <div class="group" id="apps" aria-labelledby="h-apps"></div>

  <footer>Tap. Save. Connect.</footer>
</main>

<script>
// ===== Palitan mo lang ito =====
const P = {
  name: "Mr. Astrera Patrick P.",
  role: "IT Student",
  org: "ACTS Computer College",
  bio: "IT student at ACTS Computer College. I build mobile apps like CookMate.AI and ForeCatch, plus web projects, business websites, digital video invitations, and other digital projects.",
  photo: PHOTO,                      // naka-embed na picture, o "" para initial lang
  phone: "09317628695",
  email: "patricklaptop30@gmail.com",
  address: "Brgy. Ctablingan, General Nakar, Quezon",
  maps: "https://maps.app.goo.gl/9Vgycv4kLygZojGy7",
  links: [                           // icon: fb, ig
    { label: "Facebook", sub: "Facebook profile", url: "https://www.facebook.com/share/1EP8GsyMfA/", icon: "fb", cls: "facebook" },
    { label: "Instagram", sub: "@patr_ast", url: "https://www.instagram.com/patr_ast", icon: "ig", cls: "instagram" },
  ],
  apps: [                            // url: Google Drive link o APK file sa tabi nito
    { label: "CookMate.AI", sub: "Mobile app · Google Drive", url: "https://drive.google.com/file/d/12renyboOWtkeME4YyFejfGKlYRlJJLk7/view?usp=drive_link", icon: "app", cls: "app-cook" },
    { label: "ForeCatch App", sub: "Android app · APK, 58 MB", url: "ForeCatch-v1.0.0.apk", icon: "app", cls: "app-fore" },
  ],
};
// ===============================

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
const icon = n => `<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const text = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const prettyPhone = p => p.replace(/^(\d{4})(\d{3})(\d{4})$/, "$1 $2 $3");

function vcard(p) {
  return ["BEGIN:VCARD", "VERSION:3.0",
    "FN:" + esc(p.name), "ORG:" + esc(p.org), "TITLE:" + esc(p.role),
    "TEL;TYPE=CELL:" + p.phone, "EMAIL:" + p.email,
    "ADR;TYPE=HOME:;;" + esc(p.address) + ";;;;",
    ...p.links.map(l => "URL:" + l.url), "END:VCARD"].join("\r\n");
}
console.assert(vcard({ ...P, name: "A,B" }).includes("FN:A\\,B"), "vCard escaping broken");
console.assert(prettyPhone("09317628695") === "0931 762 8695", "phone format broken");

function saveContact() {
  const url = URL.createObjectURL(new Blob([vcard(P)], { type: "text/vcard" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: P.name.replace(/\W+/g, "_") + ".vcf" });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  $("toast").textContent = "Contact file sent to your phone. If it didn't open, save " + prettyPhone(P.phone) + " manually.";
}

function row(item, isApp) {
  const a = document.createElement("a");
  a.className = "link"; a.href = item.url;
  const apk = item.url.endsWith(".apk");
  if (apk) a.setAttribute("download", "");
  else { a.target = "_blank"; a.rel = "noopener"; }
  a.innerHTML = `<span class="badge ${item.cls}">${icon(item.icon)}</span>
    <span class="t"><b>${text(item.label)}</b><small>${text(item.sub)}</small></span>
    <svg class="go" aria-hidden="true"><use href="#i-${apk ? "down" : "arrow"}"/></svg>`;
  return a;
}

$("name").textContent = P.name;
$("role").textContent = P.role + " · " + P.org;
$("bio").textContent = P.bio;
if (P.photo) $("photo").insertAdjacentHTML("afterbegin", `<img src="${text(P.photo)}" alt="${text(P.name)} at ACTS Computer College" width="720" height="960">`);
$("save").onclick = saveContact;

[["Call", "tel:" + P.phone, "phone"], ["Text", "sms:" + P.phone, "sms"],
 ["Email", "mailto:" + P.email, "mail"], ["Map", P.maps, "pin"]].forEach(([label, href, ic]) => {
  const a = document.createElement("a");
  a.className = "tile"; a.href = href;
  if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
  a.innerHTML = `<span class="ic">${icon(ic)}</span>${label}`;
  $("contact").append(a);
});

$("details").innerHTML = [["phone", prettyPhone(P.phone)], ["mail", P.email], ["pin", P.address], ["school", P.org]]
  .map(([i, v]) => `<div class="row">${icon(i)}<span>${text(v)}</span></div>`).join("");

P.links.forEach(l => $("links").append(row(l)));
P.apps.forEach(l => $("apps").append(row(l, true)));
</script>
